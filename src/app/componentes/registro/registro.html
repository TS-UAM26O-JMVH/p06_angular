<div class="registro">
    <h1>{{ 'REGISTER' | translate }}</h1>

    <div class="tarjeta">
        <div class="progreso linea">
            @for (paso of pasos; track $index) {
            <div class="paso">
                <div class="circulo" [class.completado]="pasosComp[$index]" [class.actual]="$index === pasoActual">
                    @if (pasosComp[$index]) {
                    <span>&#10003;</span>
                    }
                </div>
                <div class="contenedor-paso" (click)="paso.accion()">
                    <p class="texto">{{ paso.texto | translate }}</p>
                    <div class="icono">
                        <img [src]="paso.icono" [alt]="paso.alt" />
                    </div>
                </div>
            </div>
            }
        </div>

        <button class="registrar" (click)="registrar()"
            [disabled]="registrando || !(pasosComp[0] && pasosComp[1] && pasosComp[2])">
            @if (!registrando) {
            <span>{{ 'REG' | translate }}</span>
            } @else {
            <span>{{ 'REGISTRANDO' | translate }}...</span>
            }
        </button>

        @if (errorRegistro) {
        <div class="mensaje-error">{{ errorRegistro }}</div>
        }
    </div>

    <div class="selector-idioma">
        <button (click)="cambiarIdioma('es')">Español</button>
        <button (click)="cambiarIdioma('en')">English</button>
    </div>
</div>
